        let currentIndex = 0;

        const elQSource = document.getElementById('q-source');
        const elQDesc = document.getElementById('q-desc');
        const elCodeContainer = document.getElementById('code-container');
        const elProgressText = document.getElementById('progress-text');
        const elProgressBar = document.getElementById('progress-bar');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnCheck = document.getElementById('btn-check');
        const btnAnswer = document.getElementById('btn-answer');
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toast-icon');
        const toastMsg = document.getElementById('toast-msg');

        function init() {
            renderQuestion();
            updateControls();
            
            btnNext.addEventListener('click', () => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                    updateControls();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                    updateControls();
                }
            });

            btnCheck.addEventListener('click', checkAnswers);
    btnAnswer.addEventListener('click', showAnswers);
}

function renderQuestion() {
    const q = questions[currentIndex];
    elQSource.textContent = q.source;
    elQDesc.textContent = q.desc;
    
    // Progress
    elProgressText.textContent = `${currentIndex + 1} / ${questions.length}`;
    elProgressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

    // 1. Prism.js가 [BLANK_X] 특수기호를 쪼개지 못하도록 영문/숫자로만 이루어진 임시 텍스트로 치환
    let tempCode = q.code.replace(/\[BLANK_(\d+)\]/g, '___BLANK_$1___');

    // 2. Prism.js를 사용하여 파이썬 코드를 완벽하게 구문 강조 (Syntax Highlighting)
    let highlightedCode = Prism.highlight(tempCode, Prism.languages.python, 'python');

    // 3. 임시 텍스트를 실제 입력할 수 있는 네모칸(Input)으로 치환
    let formattedCode = highlightedCode.replace(/___BLANK_(\d+)___/g, (match, p1) => {
        return `<input type="text" id="blank_${p1}" data-index="${p1}" class="blank-input" autocomplete="off" placeholder="">`;
    });

    elCodeContainer.innerHTML = formattedCode;

    // Re-bind input events to remove colors on type
    const inputs = document.querySelectorAll('.blank-input');
    inputs.forEach(input => {
        input.addEventListener('input', () => {
            input.classList.remove('correct', 'incorrect');
        });
    });
}

function updateControls() {
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === questions.length - 1;
        }

        function cleanString(str) {
            return str.replace(/\s+/g, '').toLowerCase(); // Remove all spaces and lowercase for lenient checking
        }

        function checkAnswers() {
            const q = questions[currentIndex];
            const inputs = document.querySelectorAll('.blank-input');
            let allCorrect = true;

            inputs.forEach(input => {
                const idx = input.getAttribute('data-index');
                const userVal = cleanString(input.value);
                const validAnswers = q.answers[idx].map(cleanString);

                input.classList.remove('correct', 'incorrect');

                if (userVal === '') {
                    input.classList.add('incorrect');
                    allCorrect = false;
                } else if (validAnswers.includes(userVal)) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('incorrect');
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                showToast("정답입니다! 완벽해요 👏", "success");
            } else {
                showToast("틀린 부분이 있습니다. 다시 확인해보세요 🥲", "error");
            }
        }

        function showAnswers() {
            const q = questions[currentIndex];
            const inputs = document.querySelectorAll('.blank-input');
            
            inputs.forEach(input => {
                const idx = input.getAttribute('data-index');
                input.value = q.answers[idx][0]; // Show the first valid answer
                input.classList.remove('incorrect');
                input.classList.add('correct');
            });
            showToast("정답이 표시되었습니다.", "info");
        }

        let toastTimeout;
        function showToast(message, type) {
            clearTimeout(toastTimeout);
            
            toast.className = `fixed bottom-10 left-1/2 transform -translate-x-1/2 px-6 py-4 rounded-full text-white font-bold text-lg shadow-2xl z-50 flex items-center gap-3 toast-enter`;
            
            if (type === "success") {
                toast.classList.add("bg-green-600");
                toastIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else if (type === "error") {
                toast.classList.add("bg-red-600");
                toastIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                toast.classList.add("bg-blue-600");
                toastIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toastMsg.textContent = message;
            toast.style.display = 'flex';

            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 300); // Wait for exit animation
            }, 2500);
        }

        // Run
        init();
    </script>
